version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: sobolevayum-netology-prometheus
    restart: always
    depends_on:
      - pushgateway
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    networks:
      - sobolevayum-my-netology-hw

  pushgateway:
    image: prom/pushgateway:latest
    container_name: sobolevayum-netology-pushgateway
    restart: always
    ports:
      - "9091:9091"
    networks:
      - sobolevayum-my-netology-hw

  grafana:
    image: grafana/grafana:latest
    container_name: sobolevayum-netology-grafana
    restart: always
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana:/etc/grafana
    environment:
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
    ports:
      - "80:3000"
    networks:
      - sobolevayum-my-netology-hw
  alertmanager:
    image: prom/alertmanager:latest
    container_name: sobolevayum-netology-alertmanager
    restart: always
    depends_on:
      - prometheus
    volumes:
      - ./alertmanager:/etc/alertmanager
    ports:
      - "9093:9093"
    networks:
      - sobolevayum-my-netology-hw

volumes:
  prometheus_data: {}
  grafana_data: {}

networks:
  sobolevayum-my-netology-hw:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/16